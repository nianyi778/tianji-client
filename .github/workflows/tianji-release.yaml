# 天机客户端的发布构建。
#
# ⚠️ **另建一个而不是改上游的 build.yaml** —— 那样合并上游时冲突最小。
#    上游那个的 upload job 依赖它自己的分发渠道(Telegram / Homebrew / AUR)的密钥,
#    我们没有也不需要; 直接跑它会失败。
#
# ⚠️ 只出 **Android + Windows + Linux**。macOS 要 Apple 证书才能免告警分发,
#    iOS 要开发者账号 —— 都留到以后。
#
# ⚠️ 产物发到 **GitHub Releases** 而不是自建 CDN:
#    代理工具的第三方安装包是投毒重灾区, 客户没法验证的安装包我们自己也不该发。
#    Releases + 公开源码 = 与推荐上游同一个信任模型(见 tianjiv1 的 clients.ts)。
name: 天机客户端发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，如 v0.8.96-tianji.1'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: android, os: ubuntu-latest }
          - { platform: windows, os: windows-2022, arch: amd64 }
          - { platform: linux,   os: ubuntu-22.04, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: actions/setup-go@v5
        with: { go-version: '1.26.4' }

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r28c }

      - name: Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev locate

      # ⚠️ 签名密钥从 Secrets 解出来。**没有它 APK 装不上** ——
      #    Android 拒绝安装未签名的包, 而那个失败发生在客户手机上, 我们看不到。
      - name: 配置 Android 签名
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "storeFile=keystore.jks"
          } > android/local.properties

      - run: dart pub get
      - run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }} -v

      - uses: actions/upload-artifact@v4
        with:
          name: tianji-${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            天机客户端 —— 基于 [FlClash](https://github.com/chen08209/FlClash)（GPL-3.0）的定制版。

            只改了名字、图标和一键导入，**内核一行未动**。[源码](https://github.com/nianyi778/tianji-client)

            装好后在[个人中心](https://www.divinations.top/me)点「导入」直接装订阅。
