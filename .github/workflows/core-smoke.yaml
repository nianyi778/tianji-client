# 引擎编译验证 —— 只编 Go 内核，不打包、不发布、不动 release。
#
# 用途：升 `core/Clash.Meta` 子模块（mihomo 分支）之后，先确认我们这一层 Go 包装
# 还能对着新引擎编译。上游经常把引擎升级和包装层重写一起发，只挪子模块指针未必编得过。
#
# 🔴 判断引擎能不能升，必须**先在 main 上跑一次做对照**。没有对照时，失败分不清是
#    「新引擎不兼容」还是「这条流水线本身就不通」——那会导致照着错误结论做决定。
name: 引擎编译验证

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core-smoke.yaml'

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: 记录引擎指向
        run: |
          echo "子模块提交: $(git -C core/Clash.Meta rev-parse HEAD)"
          git -C core/Clash.Meta log -1 --format='%ad %s' --date=short

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: 编译内核
        working-directory: core
        run: |
          go mod download
          go build ./...

      - name: 内核自带测试
        working-directory: core
        continue-on-error: true
        run: go test ./... 2>&1 | tail -40
