# 引擎编译验证 —— 跑一次真实的 Linux 构建，不上传、不发布、不动 release。
#
# 用途：升 `core/Clash.Meta` 子模块（mihomo 分支）之后，先确认我们这一层 Go 包装
# 与 Dart 侧还能对着新引擎编译。上游经常把引擎升级和包装层重写一起发，
# 只挪子模块指针未必编得过。
#
# 🔴 判断引擎能不能升，必须**先在 main 上跑一次做对照**。没有对照时，失败分不清是
#    「新引擎不兼容」还是「这条流水线本身就不通」——那会导致照着错误结论做决定。
#    2026-09-30 第一版就是这么废掉的：它用 `go build ./...`，而 core/tun 与 bride.go
#    是 `//go:build android && cgo`，纯 linux 下本来就被排除，main 上照样红。
#    所以这里改成照抄发布流水线的 Linux 构建路径 —— 那条在 main 上是已知能过的。
name: 引擎编译验证

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core-smoke.yaml'

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: 记录引擎指向
        run: |
          echo "子模块提交: $(git -C core/Clash.Meta rev-parse HEAD)"
          git -C core/Clash.Meta log -1 --format='%ad %s' --date=short

      - uses: actions/setup-go@v5
        with: { go-version: '1.26.4' }

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev locate

      # 与发布流水线逐字相同：先 flutter pub get，再不带多余参数地调 setup.dart
      - run: flutter pub get
      - run: dart setup.dart linux -v

      - name: 产物清单（不上传）
        run: ls -la dist/ || true
