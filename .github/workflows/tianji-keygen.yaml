# 一次性: 在 Actions 里生成 Android 签名密钥并打印 base64。
#
# ⚠️ 为什么在云端生成: 本机没有 JDK(装不上), 而 keytool 是 JDK 自带的。
# ⚠️ 只能**手动触发**(workflow_dispatch), 不会自动跑。
# ⚠️ 用完**立刻删掉这个文件** —— 它把密钥打进日志, 而 Actions 日志对仓库协作者可见。
#    密钥一旦泄漏, 别人就能签出冒充天机的 APK。
name: tianji-keygen (一次性)
on:
  workflow_dispatch:
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: 生成 keystore
        run: |
          keytool -genkeypair -v -keystore ks.jks -keyalg RSA -keysize 4096 \
            -validity 10000 -alias tianji \
            -storepass "${{ github.run_id }}${{ github.run_number }}" \
            -keypass  "${{ github.run_id }}${{ github.run_number }}" \
            -dname "CN=Tianji, OU=Tianji, O=Tianji, L=Tokyo, S=Tokyo, C=JP"
          echo "::add-mask::${{ github.run_id }}${{ github.run_number }}"
          echo "=== KEYSTORE_BASE64 开始 ==="
          base64 -w0 ks.jks
          echo ""
          echo "=== KEYSTORE_BASE64 结束 ==="
          echo "口令(store 与 key 相同): ${{ github.run_id }}${{ github.run_number }}"
          echo "alias: tianji"
